<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Perfil de suelo con horizontes, raíces, materia orgánica y agua">
  <title>Perfil de suelo</title>
  <desc>Esquema didáctico de un perfil de suelo: horizonte superficial con materia orgánica, raíces de planta, horizonte subsuperficial, horizonte parental y agua infiltrada.</desc>
  <!-- Capa de agua subterránea -->
  <rect x="0" y="300" width="600" height="100" fill="#3b6ea5" opacity="0.55"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="#2d4e73" stroke-width="2"/>
  <text x="30" y="325" font-family="Arial,sans-serif" font-size="12" fill="#0b1520">Agua infiltrada</text>
  <!-- Horizontes de suelo -->
  <rect x="0" y="40" width="600" height="90" fill="#5d4037" opacity="0.95"/>
  <rect x="0" y="130" width="600" height="110" fill="#8d6e63" opacity="0.9"/>
  <rect x="0" y="240" width="600" height="60" fill="#a1887f" opacity="0.85"/>
  <text x="30" y="75" font-family="Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Horizonte superficial (materia orgánica, raíces)</text>
  <text x="30" y="165" font-family="Arial,sans-serif" font-size="14" fill="#0b1520" font-weight="bold">Horizonte subsuperficial</text>
  <text x="30" y="275" font-family="Arial,sans-serif" font-size="14" fill="#0b1520" font-weight="bold">Horizonte parental</text>
  <!-- Raíces -->
  <path d="M120 130 Q100 200 130 260 M180 130 Q200 210 230 270 M260 130 Q240 220 270 280 M340 130 Q320 210 350 270 M420 130 Q400 200 430 260 M500 130 Q520 210 510 270" stroke="#3e2723" stroke-width="3" fill="none" opacity="0.8"/>
  <text x="300" y="210" font-family="Arial,sans-serif" font-size="11" fill="#3e2723" text-anchor="middle">Raíces</text>
  <!-- Materia orgánica en superficie -->
  <path d="M50 45 Q70 35 90 45 Q110 35 130 45" stroke="#4e342e" stroke-width="5" fill="none"/>
  <text x="300" y="35" font-family="Arial,sans-serif" font-size="12" fill="#4e342e" text-anchor="middle">Hojarasca y materia orgánica</text>
  <!-- Flechas descriptivas -->
  <text x="560" y="60" font-family="Arial,sans-serif" font-size="11" fill="#0b1520" text-anchor="end">Superficie</text>
  <text x="560" y="380" font-family="Arial,sans-serif" font-size="11" fill="#0b1520" text-anchor="end">Profundidad</text>
</svg>
