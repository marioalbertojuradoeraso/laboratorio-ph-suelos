<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Sedimento de río con agua, partículas, materia orgánica y microorganismos">
  <title>Sedimento de río</title>
  <desc>Esquema didáctico de un lecho de río: agua sobrenadante, sedimento con partículas, materia orgánica y microorganismos en el sedimento.</desc>
  <!-- Agua sobrenadante -->
  <rect x="0" y="0" width="600" height="150" fill="#b2e0f5" opacity="0.85"/>
  <line x1="0" y1="150" x2="600" y2="150" stroke="#7cb3e8" stroke-width="2"/>
  <text x="30" y="75" font-family="Arial,sans-serif" font-size="14" fill="#0b1520" font-weight="bold">Agua sobrenadante</text>
  <!-- Superficie del sedimento -->
  <path d="M0 150 Q100 160 300 150 Q500 140 600 150 L600 400 L0 400 Z" fill="#8d6e63" opacity="0.9"/>
  <text x="30" y="185" font-family="Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Sedimento (partículas, materia orgánica)</text>
  <!-- Partículas en el sedimento -->
  <circle cx="100" cy="220" r="4" fill="#5d4037" opacity="0.9"/>
  <circle cx="140" cy="250" r="6" fill="#6d4c41" opacity="0.9"/>
  <circle cx="180" cy="210" r="3" fill="#795548" opacity="0.9"/>
  <circle cx="420" cy="230" r="5" fill="#5d4037" opacity="0.9"/>
  <circle cx="480" cy="270" r="7" fill="#6d4c41" opacity="0.9"/>
  <circle cx="540" cy="200" r="4" fill="#795548" opacity="0.9"/>
  <!-- Materia orgánica -->
  <path d="M250 190 Q270 170 290 190 Q310 170 330 190" stroke="#4e342e" stroke-width="4" fill="none"/>
  <text x="290" y="165" font-family="Arial,sans-serif" font-size="11" fill="#4e342e" text-anchor="middle">Materia orgánica</text>
  <!-- Microorganismos -->
  <circle cx="200" cy="300" r="8" fill="#2e7d32" opacity="0.8"/>
  <circle cx="200" cy="300" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="400" cy="330" r="7" fill="#1b5e20" opacity="0.8"/>
  <circle cx="400" cy="330" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="520" cy="310" r="6" fill="#388e3c" opacity="0.8"/>
  <circle cx="520" cy="310" r="3" fill="#ffffff" opacity="0.6"/>
  <text x="300" y="375" font-family="Arial,sans-serif" font-size="12" fill="#1b5e20" text-anchor="middle">Microorganismos</text>
  <!-- Flecha interfaz agua-sedimento -->
  <line x1="300" y1="150" x2="300" y2="160" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
