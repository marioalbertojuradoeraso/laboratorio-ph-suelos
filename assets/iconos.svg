<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" role="img" aria-label="Iconos simples del laboratorio de pH">
  <title>Iconos del laboratorio</title>
  <desc>Iconos simples: suelo, sedimento, gota, planta, microorganismo, termómetro, alerta, fuente.</desc>
  <defs>
    <style>.icono{fill:#fbbf24;}.icono-alt{fill:#3b82f6;}.icono-alerta{fill:#ef4444;}.icono-exito{fill:#34d399;}</style>
  </defs>
  <!-- Suelo -->
  <g transform="translate(30,30)">
    <path d="M20 40 Q40 10 60 40 T100 40" stroke="#fbbf24" stroke-width="4" fill="none"/>
    <rect x="35" y="40" width="30" height="30" fill="#5d4037" opacity="0.9"/>
    <text x="50" y="90" font-family="Arial,sans-serif" font-size="10" fill="#0b1520" text-anchor="middle">Suelo</text>
  </g>
  <!-- Sedimento -->
  <g transform="translate(140,30)">
    <path d="M20 60 Q40 40 60 60" stroke="#3b82f6" stroke-width="4" fill="none"/>
    <rect x="35" y="55" width="30" height="20" fill="#8d6e63" opacity="0.9"/>
    <text x="50" y="90" font-family="Arial,sans-serif" font-size="10" fill="#0b1520" text-anchor="middle">Sedimento</text>
  </g>
  <!-- Gota -->
  <g transform="translate(250,30)">
    <path d="M40 20 Q50 10 60 20 Q70 30 60 40 Q50 55 40 40 Q30 30 20 20 Q10 10 20 20 Z" fill="#3b82f6" opacity="0.9"/>
    <text x="40" y="70" font-family="Arial,sans-serif" font-size="10" fill="#0b1520" text-anchor="middle">Gota</text>
  </g>
  <!-- Planta -->
  <g transform="translate(360,30)">
    <path d="M40 20 Q40 5 45 0 Q50 5 50 20" stroke="#34d399" stroke-width="4" fill="none"/>
    <path d="M45 20 L45 50" stroke="#34d399" stroke-width="3" fill="none"/>
    <text x="45" y="85" font-family="Arial,sans-serif" font-size="10" fill="#0b1520" text-anchor="middle">Planta</text>
  </g>
  <!-- Microorganismo -->
  <g transform="translate(470,30)">
    <circle cx="40" cy="30" r="10" fill="#2e7d32" opacity="0.9"/>
    <circle cx="40" cy="30" r="5" fill="#ffffff" opacity="0.7"/>
    <text x="40" y="65" font-family="Arial,sans-serif" font-size="10" fill="#0b1520" text-anchor="middle">Microbio</text>
  </g>
  <!-- Termómetro -->
  <g transform="translate(30,80)">
    <rect x="35" y="10" width="10" height="40" fill="#e2e8f0" rx="5"/>
    <rect x="37" y="10" width="6" height="25" fill="#ef4444" rx="3"/>
    <circle cx="40" cy="10" r="7" fill="#ef4444"/>
    <text x="40" y="70" font-family="Arial,sans-serif" font-size="10" fill="#0b1520" text-anchor="middle">Temperatura</text>
  </g>
  <!-- Alerta -->
  <g transform="translate(140,80)">
    <path d="M40 10 L20 50 L60 50 Z" fill="#ef4444" opacity="0.9"/>
    <text x="40" y="30" font-family="Arial,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">!</text>
    <text x="40" y="70" font-family="Arial,sans-serif" font-size="10" fill="#0b1520" text-anchor="middle">Alerta</text>
  </g>
  <!-- Fuente -->
  <g transform="translate(250,80)">
    <path d="M35 50 Q40 40 45 50" stroke="#64748b" stroke-width="3" fill="none"/>
    <rect x="38" y="50" width="4" height="10" fill="#64748b"/>
    <circle cx="40" cy="62" r="6" fill="#64748b" opacity="0.6"/>
    <text x="40" y="85" font-family="Arial,sans-serif" font-size="10" fill="#0b1520" text-anchor="middle">Fuente</text>
  </g>
</svg>
