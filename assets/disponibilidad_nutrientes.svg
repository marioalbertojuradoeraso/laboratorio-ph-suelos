<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" role="img" aria-label="Disponibilidad de nutrientes según pH del suelo">
  <title>Disponibilidad de nutrientes según pH</title>
  <desc>Diagrama educativo: disponibilidad de nutrientes en función del pH del suelo. Basado en el SOP FAO (cb3637en.md): en suelos ácidos puede aumentar solubilidad de Al, Fe, Mn; en suelos alcalinos se reduce disponibilidad de P, Fe, Mn, Zn, Cu, B.</desc>
  <!-- Eje pH -->
  <rect x="80" y="60" width="480" height="120" fill="#ffffff" opacity="0.15" rx="8"/>
  <linearGradient id="nutGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ef444433"/>
    <stop offset="0.43" stop-color="#f59e0b33"/>
    <stop offset="0.5" stop-color="#34d39933"/>
    <stop offset="0.57" stop-color="#3b82f633"/>
    <stop offset="1%" stop-color="#1e40af33"/>
  </linearGradient>
  <rect x="80" y="60" width="480" height="120" fill="url(#nutGrad)" rx="8"/>
  <text x="80" y="185" font-family="Arial,sans-serif" font-size="12" fill="#0b1520" text-anchor="middle">pH ácido</text>
  <text x="320" y="185" font-family="Arial,sans-serif" font-size="12" fill="#0b1520" text-anchor="middle">pH neutro ~7</text>
  <text x="560" y="185" font-family="Arial,sans-serif" font-size="12" fill="#0b1520" text-anchor="end">pH alcalino</text>
  <!-- Barras de disponibilidad -->
  <text x="30" y="85" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">Fósforo (P)</text>
  <rect x="80" y="95" width="200" height="10" fill="#f59e0b" rx="3"/>
  <text x="30" y="115" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">Hierro (Fe)</text>
  <rect x="80" y="125" width="300" height="10" fill="#3b82f6" rx="3"/>
  <text x="30" y="145" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">Zinc (Zn)</text>
  <rect x="80" y="155" width="280" height="10" fill="#8b5cf6" rx="3"/>
  <text x="30" y="210" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">Aluminio (Al) - solubilidad</text>
  <rect x="80" y="220" width="150" height="10" fill="#ef4444" rx="3"/>
  <text x="30" y="250" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">Manganeso (Mn) - solubilidad</text>
  <rect x="80" y="260" width="160" height="10" fill="#ef4444" rx="3"/>
  <!-- Nota -->
  <text x="300" y="320" font-family="Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-style="italic">La disponibilidad varía con el pH; no es un diagnóstico único.</text>
</svg>
