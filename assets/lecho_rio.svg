<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" role="img" aria-label="Lecho de río con sedimento y agua sobrenadante">
  <title>Lecho de río</title>
  <desc>Ilustración didáctica de un lecho de río: agua sobrenadante, sedimento en el fondo, y distinción entre pH del sedimento y pH del agua.</desc>
  <!-- Agua sobrenadante -->
  <rect x="0" y="0" width="600" height="140" fill="#b2e0f5" opacity="0.85"/>
  <line x1="0" y1="140" x2="600" y2="140" stroke="#7cb3e8" stroke-width="2"/>
  <text x="300" y="70" font-family="Arial,sans-serif" font-size="13" fill="#0b1520" font-weight="bold" text-anchor="middle">Agua sobrenadante</text>
  <!-- Sedimento -->
  <path d="M0 140 Q100 150 300 140 Q500 130 600 140 L600 350 L0 350 Z" fill="#8d6e63" opacity="0.9"/>
  <text x="300" y="170" font-family="Arial,sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">Sedimento del lecho</text>
  <!-- Partículas -->
  <circle cx="150" cy="220" r="5" fill="#5d4037" opacity="0.9"/>
  <circle cx="450" cy="240" r="6" fill="#6d4c41" opacity="0.9"/>
  <circle cx="300" cy="200" r="4" fill="#795548" opacity="0.9"/>
  <!-- Etiquetas de pH -->
  <rect x="80" y="280" width="200" height="50" fill="#0f172a" rx="6"/>
  <text x="180" y="300" font-family="Arial,sans-serif" font-size="13" fill="#fbbf24" font-weight="bold" text-anchor="middle" font-family="monospace">pH agua</text>
  <text x="180" y="320" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">(?)</text>
  <rect x="320" y="280" width="200" height="50" fill="#0f172a" rx="6"/>
  <text x="420" y="300" font-family="Arial,sans-serif" font-size="13" fill="#3b82f6" font-weight="bold" text-anchor="middle" font-family="monospace">pH sedimento</text>
  <text x="420" y="320" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">(?)</text>
  <text x="300" y="340" font-family="Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">No son necesariamente iguales</text>
</svg>
