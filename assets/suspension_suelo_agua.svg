<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" role="img" aria-label="Vaso con suspensión suelo-agua y lectura de pH">
  <title>Suspensión suelo-agua</title>
  <desc>Ilustración didáctica de un vaso de precipitados con suspensión suelo-agua, electrodo de pH y lectura numérica.</desc>
  <!-- Vaso -->
  <rect x="200" y="60" width="200" height="220" fill="#ffffff" opacity="0.9" stroke="#94a3b8" stroke-width="2" rx="8"/>
  <rect x="200" y="60" width="200" height="20" fill="#cbd5e1" opacity="0.6" rx="8 8 0 0"/>
  <!-- Suspensión -->
  <path d="M200 250 Q300 230 400 250 L400 280 Q300 260 200 280 Z" fill="#8d6e63" opacity="0.7"/>
  <text x="300" y="235" font-family="Arial,sans-serif" font-size="11" fill="#3e2723" text-anchor="middle">Suspensión suelo-agua</text>
  <!-- Electrodo -->
  <line x1="300" y1="60" x2="300" y2="250" stroke="#64748b" stroke-width="4"/>
  <rect x="290" y="240" width="20" height="20" fill="#3b82f6" rx="2"/>
  <text x="300" y="52" font-family="Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Electrodo de pH</text>
  <!-- Lectura -->
  <rect x="220" y="300" width="160" height="40" fill="#0f172a" rx="6"/>
  <text x="300" y="326" font-family="Arial,sans-serif" font-size="18" fill="#fbbf24" font-weight="bold" text-anchor="middle" font-family="monospace">pH 6,2</text>
  <text x="300" y="340" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">a 21 °C</text>
</svg>
